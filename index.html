<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة القرآن الكريم</title>
    <style>
        :root {
            --primary: #1b4332;
            --accent: #d4af37;
            --bg-overlay: rgba(10, 25, 47, 0.88);
            --card-bg: rgba(255, 255, 255, 0.07);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover fixed no-repeat;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent);
            margin: 0 0 10px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        select {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .reciter-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }

        .info-title {
            font-size: 1.4em;
            margin: 10px 0;
            color: var(--accent);
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background-color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>القرآن الكريم - أصوات نديّة</h1>
        <p>استمع وحمّل لصفوة القراء وبكل السور</p>
    </header>

    <div class="controls">
        <select id="reciterSelect" onchange="loadSurahs()"></select>
        <select id="surahSelect" onchange="playAudio()"></select>
    </div>

    <div class="player-card">
        <img id="reciterImg" class="reciter-image" src="" alt="صورة القارئ">
        <div id="playerTitle" class="info-title">اختر القارئ والسورة</div>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadBtn" class="download-btn" href="#" download target="_blank">تحميل السورة MP3</a>
    </div>
</div>

<script>
    const reciters = [
        { name: "ياسر الدوسري", server: "https://server11.mp3quran.net/yasser/", img: "https://www.mp3quran.net/images/reciters/128.jpg" },
        { name: "ماهر المعيقلي", server: "https://server12.mp3quran.net/maher/", img: "https://www.mp3quran.net/images/reciters/102.jpg" },
        { name: "عبد الرحمن السديس", server: "https://server11.mp3quran.net/sds/", img: "https://www.mp3quran.net/images/reciters/64.jpg" },
        { name: "سعود الشريم", server: "https://server7.mp3quran.net/shur/", img: "https://www.mp3quran.net/images/reciters/54.jpg" },
        { name: "مشاري العفاسي", server: "https://server8.mp3quran.net/afs/", img: "https://www.mp3quran.net/images/reciters/118.jpg" },
        { name: "سعد الغامدي", server: "https://server7.mp3quran.net/s_gmd/", img: "https://www.mp3quran.net/images/reciters/32.jpg" },
        { name: "أحمد بن علي العجمي", server: "https://server10.mp3quran.net/ajm/", img: "https://www.mp3quran.net/images/reciters/10.jpg" },
        { name: "أبو بكر الشاطري", server: "https://server11.mp3quran.net/shatri/", img: "https://www.mp3quran.net/images/reciters/46.jpg" },
        { name: "ناصر القطامي", server: "https://server6.mp3quran.net/qtm/", img: "https://www.mp3quran.net/images/reciters/114.jpg" },
        { name: "محمود خليل الحصري", server: "https://server13.mp3quran.net/husr/", img: "https://www.mp3quran.net/images/reciters/98.jpg" },
        { name: "محمد صديق المنشاوي", server: "https://server10.mp3quran.net/minsh/", img: "https://www.mp3quran.net/images/reciters/108.jpg" },
        { name: "عبد الباسط عبد الصمد", server: "https://server7.mp3quran.net/basit/", img: "https://www.mp3quran.net/images/reciters/29.jpg" }
    ];

    let surahsList = [];

    async function init() {
        const reciterSelect = document.getElementById('reciterSelect');
        reciters.forEach((r, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = r.name;
            reciterSelect.appendChild(opt);
        });

        try {
            const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
            const data = await res.json();
            surahsList = data.chapters;
            loadSurahs();
        } catch (e) {
            console.error("خطأ بتحميل قائمة السور", e);
        }
    }

    function loadSurahs() {
        const reciterIndex = document.getElementById('reciterSelect').value;
        const surahSelect = document.getElementById('surahSelect');
        const selectedReciter = reciters[reciterIndex];

        document.getElementById('reciterImg').src = selectedReciter.img;
        surahSelect.innerHTML = '';

        surahsList.forEach(surah => {
            const opt = document.createElement('option');
            const padNum = String(surah.id).padStart(3, '0');
            opt.value = `${selectedReciter.server}${padNum}.mp3`;
            opt.textContent = `${surah.id}. سورة ${surah.name_arabic}`;
            surahSelect.appendChild(opt);
        });

        playAudio();
    }

    function playAudio() {
        const surahSelect = document.getElementById('surahSelect');
        const reciterSelect = document.getElementById('reciterSelect');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const downloadBtn = document.getElementById('downloadBtn');

        if (surahSelect.options.length > 0) {
            const reciterName = reciterSelect.options[reciterSelect.selectedIndex].text;
            const surahName = surahSelect.options[surahSelect.selectedIndex].text;
            const audioUrl = surahSelect.value;

            audioPlayer.src = audioUrl;
            downloadBtn.href = audioUrl;
            playerTitle.textContent = `${surahName} - بصوت ${reciterName}`;
        }
    }

    init();
</script>
</body>
</html>
