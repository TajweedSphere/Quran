<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف | استماع وتحميل</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #d4af37;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #212529;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding-bottom: 40px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent);
        }

        .audio-player-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .audio-player-box h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-family: 'Amiri', serif;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s, transform 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .download-btn.disabled {
            background-color: #ccc;
            pointer-events: none;
        }

        .error-msg {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>المصحف الشريف الرقمي</h1>
        <p>استمع وحمّل كافة سور القرآن الكريم بصوت كبار القراء</p>
    </header>

    <div class="container">
        <div class="controls-grid">
            <div>
                <label for="reciterSelect">اختر القارئ (50 قارئ):</label>
                <select id="reciterSelect" onchange="loadAudio()"></select>
            </div>
            <div>
                <label for="surahSelect">اختر السورة:</label>
                <select id="surahSelect" onchange="loadAudio()"></select>
            </div>
        </div>

        <div class="audio-player-box">
            <h3 id="nowPlaying">جاري التحميل...</h3>
            <p id="statusMsg" class="error-msg"></p>
            <audio id="audioPlayer" controls></audio>
            <br>
            <a id="downloadBtn" class="download-btn" href="#" download target="_blank">📥 تحميل السورة (MP3)</a>
        </div>
    </div>

    <script>
        const recitersList = [
            { name: "ياسر الدوسري", server: "https://server11.mp3quran.net/yasser/" },
            { name: "محمد صديق المنشاوي (مرتل)", server: "https://server10.mp3quran.net/minsh/" },
            { name: "محمد صديق المنشاوي (مجود)", server: "https://server10.mp3quran.net/minsh/Almusshaf-Almojawwad/" },
            { name: "عبد الباسط عبد الصمد (مرتل)", server: "https://server7.mp3quran.net/basit/" },
            { name: "عبد الباسط عبد الصمد (مجود)", server: "https://server7.mp3quran.net/basit/Almusshaf-Almojawwad/" },
            { name: "محمود خليل الحصري (مرتل)", server: "https://server13.mp3quran.net/hussary/" },
            { name: "محمود خليل الحصري (مجود)", server: "https://server13.mp3quran.net/hussary/Almusshaf-Almojawwad/" },
            { name: "ماهر المعيقلي", server: "https://server12.mp3quran.net/maher/" },
            { name: "محمد أيوب", server: "https://server8.mp3quran.net/m_ayyoub/" },
            { name: "محمد اللحيدان", server: "https://server8.mp3quran.net/lhdan/" },
            { name: "مهدي الشيشاني", server: "https://server14.mp3quran.net/shis/" },
            { name: "عبد الرحمن السديس", server: "https://server11.mp3quran.net/sds/" },
            { name: "سعود الشريم", server: "https://server7.mp3quran.net/shur/" },
            { name: "سعد الغامدي", server: "https://server7.mp3quran.net/s_gmd/" },
            { name: "مشاري العفاسي", server: "https://server8.mp3quran.net/afs/" },
            { name: "أحمد بن علي العجمي", server: "https://server10.mp3quran.net/ajm/" },
            { name: "أبو بكر الشاطري", server: "https://server11.mp3quran.net/shatri/" },
            { name: "علي الحذيفي", server: "https://server9.mp3quran.net/hthfi/" },
            { name: "فارس عباد", server: "https://server8.mp3quran.net/frs_a/" },
            { name: "إدريس أبكر", server: "https://server6.mp3quran.net/abkar/" },
            { name: "ناصر القطامي", server: "https://server6.mp3quran.net/qtm/" },
            { name: "هاني الرفاعي", server: "https://server8.mp3quran.net/hrefe/" },
            { name: "صلاح بو خاطر", server: "https://server8.mp3quran.net/bu_khtr/" },
            { name: "خالد الجليل", server: "https://server10.mp3quran.net/jleel/" },
            { name: "محمود علي البنا (مرتل)", server: "https://server8.mp3quran.net/bna/" },
            { name: "محمود علي البنا (مجود)", server: "https://server8.mp3quran.net/bna/Almusshaf-Almojawwad/" },
            { name: "مصطفى إسماعيل", server: "https://server8.mp3quran.net/mustafa/" },
            { name: "عبد الرشيد صوفي", server: "https://server16.mp3quran.net/sofi/Rwayat-Khalf-An-Hamzah/" },
            { name: "محمد المحيسني", server: "https://server11.mp3quran.net/mhesne/" },
            { name: "عادل ريان", server: "https://server8.mp3quran.net/ryan/" },
            { name: "عبد المحسن القاسم", server: "https://server8.mp3quran.net/qasm/" },
            { name: "توفيق الصائغ", server: "https://server6.mp3quran.net/twfeeq/" },
            { name: "عبد البارئ الثبيتي", server: "https://server6.mp3quran.net/thubti/" },
            { name: "خالد القحطاني", server: "https://server10.mp3quran.net/qht/" },
            { name: "صلاح البدير", server: "https://server6.mp3quran.net/s_bdr/" },
            { name: "عبد الله الجهني", server: "https://server13.mp3quran.net/jhn/" },
            { name: "نبيل الرفاعي", server: "https://server9.mp3quran.net/nabil/" },
            { name: "علي جابر", server: "https://server11.mp3quran.net/a_jabr/" },
            { name: "محمد جبريل", server: "https://server8.mp3quran.net/jbrl/" },
            { name: "شيرازاد طاهر", server: "https://server12.mp3quran.net/shirazad/" },
            { name: "معيض الحارثي", server: "https://server8.mp3quran.net/harthy/" },
            { name: "حاتم فريد الواعر", server: "https://server11.mp3quran.net/hatem/" },
            { name: "عبد الله خياط", server: "https://server12.mp3quran.net/kyat/" },
            { name: "جمعان العصيمي", server: "https://server6.mp3quran.net/jmn/" },
            { name: "إبراهيم الأخضر", server: "https://server6.mp3quran.net/akhdar/" },
            { name: "يوسف بن نوح أحمد", server: "https://server8.mp3quran.net/nooh/" },
            { name: "مفتاح السلطني", server: "https://server10.mp3quran.net/a_sltn/" },
            { name: "عبد العزيز الأحمد", server: "https://server11.mp3quran.net/a_ahmed/" },
            { name: "مصطفى اللاهوني", server: "https://server6.mp3quran.net/lahoni/" },
            { name: "خالد المهنا", server: "https://server11.mp3quran.net/mohna/" }
        ];

        async function initApp() {
            const reciterSelect = document.getElementById('reciterSelect');
            recitersList.forEach((r) => {
                let opt = document.createElement('option');
                opt.value = r.server;
                opt.innerText = r.name;
                reciterSelect.appendChild(opt);
            });

            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const surahSelect = document.getElementById('surahSelect');

                data.data.forEach(surah => {
                    let opt = document.createElement('option');
                    opt.value = String(surah.number).padStart(3, '0');
                    opt.innerText = `${surah.number}. ${surah.name}`;
                    surahSelect.appendChild(opt);
                });

                loadAudio();
            } catch (err) {
                console.error("خطأ في تحميل السور:", err);
            }
        }

        function loadAudio() {
            const reciterSelect = document.getElementById('reciterSelect');
            const surahSelect = document.getElementById('surahSelect');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusMsg = document.getElementById('statusMsg');

            const reciterServer = reciterSelect.value;
            const surahNum = surahSelect.value;
            const reciterName = reciterSelect.options[reciterSelect.selectedIndex].text;
            const surahName = surahSelect.options[surahSelect.selectedIndex].text;

            const audioUrl = `${reciterServer}${surahNum}.mp3`;
            
            statusMsg.innerText = "جاري التحقق من التلاوة...";
            downloadBtn.classList.add('disabled');

            audioPlayer.src = audioUrl;
            
            audioPlayer.oncanplay = function() {
                statusMsg.innerText = "";
                document.getElementById('nowPlaying').innerText = `سورة ${surahName} - بصوت ${reciterName}`;
                downloadBtn.href = audioUrl;
                downloadBtn.setAttribute('download', `${surahName} - ${reciterName}.mp3`);
                downloadBtn.classList.remove('disabled');
            };

            audioPlayer.onerror = function() {
                statusMsg.innerText = `عذراً، هذه السورة غير متوفرة للتسجيل التلاوة الخاص بـ (${reciterName}). يرجى اختيار قارئ آخر أو سورة أخرى.`;
                document.getElementById('nowPlaying').innerText = `غير متوفر`;
                downloadBtn.classList.add('disabled');
            };
        }

        window.onload = initApp;
    </script>
</body>
</html>
