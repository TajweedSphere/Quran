<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف | استماع وتحميل</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #d4af37;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #212529;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding-bottom: 40px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--accent);
        }

        .audio-player-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .audio-player-box h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-family: 'Amiri', serif;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.3s, transform 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .download-btn.disabled {
            background-color: #ccc;
            pointer-events: none;
        }

        .status-msg {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>المصحف الشريف الرقمي</h1>
        <p>استمع وحمّل كافة سور القرآن الكريم بصوت كبار القراء</p>
    </header>

    <div class="container">
        <div class="controls-grid">
            <div>
                <label for="reciterSelect">اختر القارئ:</label>
                <select id="reciterSelect" onchange="loadSurahsForReciter()"></select>
            </div>
            <div>
                <label for="surahSelect">اختر السورة:</label>
                <select id="surahSelect" onchange="playAudio()"></select>
            </div>
        </div>

        <div class="audio-player-box">
            <h3 id="nowPlaying">جاري تحميل القراء...</h3>
            <p id="statusMsg" class="status-msg"></p>
            <audio id="audioPlayer" controls></audio>
            <br>
            <a id="downloadBtn" class="download-btn disabled" href="#" download target="_blank">📥 تحميل السورة (MP3)</a>
        </div>
    </div>

    <script>
        let recitersData = [];
        let allSurahs = [];

        async function initApp() {
            try {
                // جلب قائمة السور الرسمية
                const surahRes = await fetch('https://api.alquran.cloud/v1/surah');
                const surahJson = await surahRes.json();
                allSurahs = surahJson.data;

                // جلب قائمة القراء مع السيرفرات المتاحة لكل قارئ من API MP3Quran الرسمي
                const reciterRes = await fetch('https://mp3quran.net/api/v3/reciters?language=ar');
                const reciterJson = await reciterRes.json();
                
                // تصفية القراء وتجهيز القائمة
                recitersData = reciterJson.reciters.map(r => {
                    const moshaf = r.moshaf[0]; // المصحف الأساسي المتاح
                    return {
                        id: r.id,
                        name: r.name,
                        server: moshaf ? moshaf.server : '',
                        surahList: moshaf ? moshaf.surah_list.split(',').map(Number) : []
                    };
                }).filter(r => r.server !== '');

                const reciterSelect = document.getElementById('reciterSelect');
                reciterSelect.innerHTML = '';
                
                recitersData.forEach((r, idx) => {
                    let opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = r.name;
                    reciterSelect.appendChild(opt);
                });

                loadSurahsForReciter();
            } catch (err) {
                document.getElementById('nowPlaying').innerText = "حدث خطأ في تحميل البيانات، يرجى تحديث الصفحة.";
                console.error(err);
            }
        }

        function loadSurahsForReciter() {
            const reciterIdx = document.getElementById('reciterSelect').value;
            const currentReciter = recitersData[reciterIdx];
            const surahSelect = document.getElementById('surahSelect');
            
            surahSelect.innerHTML = '';

            // تصفية السور بحيث تظهر فقط السور المتوفرة بصوت هاد القارئ بالتحديد
            allSurahs.forEach(surah => {
                if (currentReciter.surahList.includes(surah.number)) {
                    let opt = document.createElement('option');
                    opt.value = surah.number;
                    opt.innerText = `${surah.number}. ${surah.name}`;
                    surahSelect.appendChild(opt);
                }
            });

            playAudio();
        }

        function playAudio() {
            const reciterIdx = document.getElementById('reciterSelect').value;
            const surahNum = document.getElementById('surahSelect').value;
            
            if (!surahNum) {
                document.getElementById('nowPlaying').innerText = "عذراً، لا توجد سور متاحة لهذا القارئ حالياً.";
                document.getElementById('audioPlayer').src = "";
                document.getElementById('downloadBtn').classList.add('disabled');
                return;
            }

            const currentReciter = recitersData[reciterIdx];
            const surahObj = allSurahs.find(s => s.number == surahNum);
            
            // تنسيق رقم السورة إلى 3 خانات (مثل 001, 052)
            const formattedSurahNum = String(surahNum).padStart(3, '0');
            const audioUrl = `${currentReciter.server}${formattedSurahNum}.mp3`;

            const audioPlayer = document.getElementById('audioPlayer');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.innerText = "";
            audioPlayer.src = audioUrl;
            
            document.getElementById('nowPlaying').innerText = `سورة ${surahObj.name} - بصوت ${currentReciter.name}`;

            downloadBtn.href = audioUrl;
            downloadBtn.setAttribute('download', `${surahObj.name} - ${currentReciter.name}.mp3`);
                downloadBtn.classList.remove('disabled');
        }

        window.onload = initApp;
    </script>
</body>
</html>
